# Desenvolvimento local: docker compose up
# Build local das mesmas imagens do CI (TAG=dev).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: app }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready"], interval: 5s, retries: 10 }
  migrate:
    build: { context: ., dockerfile: docker/migrate.Dockerfile }
    environment: { DATABASE_URL: "postgresql://postgres:dev@db:5432/app" }
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment: { DATABASE_URL: "postgresql://postgres:dev@db:5432/app" }
    env_file: [{ path: .env, required: false }]
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment: { API_URL: "http://api:8080" }
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  pgdata:
