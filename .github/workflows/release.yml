name: Release
# Roda depois que o CI da main passa: as imagens sha-<commit> já estão no GHCR,
# escaneadas e testadas. Nada é rebuildado aqui: a mesma imagem (mesmo digest)
# é promovida para staging e, na release, ganha as tags vX.Y.Z, X.Y e latest.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/kleidimilson/zenbit-sandbox

jobs:
  meta:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env: { SHA: "${{ github.event.workflow_run.head_sha }}" }
        run: echo "tag=sha-${SHA::12}" >> "$GITHUB_OUTPUT"

  release-please:
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-staging:
    needs: meta
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Promover para a tag staging (mesmo digest)
        run: |
          for svc in api web migrate; do
            docker buildx imagetools create -t "$REGISTRY-$svc:staging" "$REGISTRY-$svc:${{ needs.meta.outputs.tag }}"
          done
      - run: bash scripts/deploy.sh staging "${{ needs.meta.outputs.tag }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=smoke
        env: { BASE_URL: "${{ vars.STAGING_URL }}", API_HEALTH_URL: "${{ vars.STAGING_API_HEALTH_URL }}" }
      - run: ./scripts/notify-discord.sh feed "🧪 Staging rodando ${{ needs.meta.outputs.tag }}"
      - if: failure()
        run: |
          ./scripts/notify-discord.sh alert "🚨 Deploy de staging falhou: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release-brief:
    # o agente release-manager resume a release para quem aprova a produção
    needs: [release-please]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release-please.outputs.tag }}", fetch-depth: 0 }
      - id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Brief do release-manager
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use o subagente release-manager. PREV=${{ steps.prev.outputs.tag }} TAG=${{ env.TAG }}.
            Grave release-brief.md no formato da skill release-brief.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 30
            --allowedTools "Read,Grep,Glob,Write(release-brief.md),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue view:*)"
      - name: Publicar brief e pedir aprovação
        run: |
          if [ -s release-brief.md ]; then
            gh release view "$TAG" --json body -q .body > /tmp/notes.md
            printf '\n\n' >> /tmp/notes.md; cat release-brief.md >> /tmp/notes.md
            gh release edit "$TAG" --notes-file /tmp/notes.md
            rec=$(head -1 release-brief.md | sed -n 's/.*recomendação: *//p')
          else
            rec="brief não gerado, revise o diff"
          fi
          ./scripts/notify-discord.sh alert "🚦 $TAG aguardando sua aprovação de produção (${rec:-ver brief}): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

  deploy-production:
    needs: [meta, release-please, deploy-staging, release-brief]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: production   # pausa até o responsável técnico aprovar
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release-please.outputs.tag }}" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Versionar imagens (vX.Y.Z, X.Y, latest) sem rebuild
        run: |
          minor="${VERSION%.*}"
          : > /tmp/digests.md
          for svc in api web migrate; do
            src="$REGISTRY-$svc:${{ needs.meta.outputs.tag }}"
            docker buildx imagetools create -t "$REGISTRY-$svc:v$VERSION" -t "$REGISTRY-$svc:$minor" -t "$REGISTRY-$svc:latest" "$src"
            digest=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' | jq -r .digest)
            echo "| \`$svc\` | \`$REGISTRY-$svc:v$VERSION\` | \`$digest\` |" >> /tmp/digests.md
          done
      - name: Anexar imagens às notas da release
        run: |
          tag="${{ needs.release-please.outputs.tag }}"
          gh release view "$tag" --json body -q .body > /tmp/notes.md
          printf '\n\n### Imagens\n\n| Serviço | Imagem | Digest |\n|---|---|---|\n' >> /tmp/notes.md
          cat /tmp/digests.md >> /tmp/notes.md
          gh release edit "$tag" --notes-file /tmp/notes.md
      - run: bash scripts/deploy.sh production "v$VERSION"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=smoke
        env: { BASE_URL: "${{ vars.PRODUCTION_URL }}", API_HEALTH_URL: "${{ vars.PRODUCTION_API_HEALTH_URL }}" }
      - run: ./scripts/notify-discord.sh feed "🚀 v$VERSION em produção"
      - if: failure()
        run: |
          ./scripts/notify-discord.sh alert "🚨 Deploy de produção v$VERSION falhou. Rollback: bash scripts/deploy.sh production <tag anterior>"

  mobile:
    # app mobile não roda em container: build nativo no EAS com a versão da release
    needs: [release-please, deploy-production]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release-please.outputs.tag }}" }
      - id: has
        run: '[ -f apps/mobile/eas.json ] && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"'
      - if: steps.has.outputs.yes == 'true'
        uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - if: steps.has.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.has.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.has.outputs.yes == 'true'
        working-directory: apps/mobile
        env: { APP_VERSION: "${{ needs.release-please.outputs.version }}" }
        run: eas build --platform all --profile production --non-interactive --no-wait
