name: Security · sprint audit
on:
  milestone:
    types: [closed]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Auditoria
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Use o subagente security e rode /security-audit no repositório inteiro.
            Contexto: docs/threat-models/ e os specs da sprint "${{ github.event.milestone.title || 'manual' }}".
            Grave findings.json e o relatório em security-report/. Não altere código.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 200
            --allowedTools "Task,Read,Grep,Glob,Write(security-report/**),Bash(node:*),Bash(git log:*)"

      - uses: actions/upload-artifact@v4
        with: { name: security-report, path: security-report/, retention-days: 90 }

      - name: Achados → issues
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: node scripts/findings-to-issues.ts security-report/findings.json

      - name: Planos grandes → Wayfinder
        if: hashFiles('security-report/clusters.json') != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Para cada cluster em security-report/clusters.json, rode /wayfinder com
            destino "corrigir a classe de vulnerabilidade inteira". Crie a issue-mapa
            (wayfinder:map) e os tickets filhos com type:security e status:draft.
            Cada ticket tem um critério Given/When/Then que vira teste de regressão.
            Decisões que exigem humano viram tickets HITL, não suposições.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(gh issue:*),Bash(gh label:*)"

      - name: Resumo
        if: always()
        run: |
          ./scripts/notify-discord.sh feed "🛡️ Auditoria da sprint: ${{ job.status }} — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
