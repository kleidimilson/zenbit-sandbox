name: Agent · implement
on:
  issues:
    types: [labeled]

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # só dispara com o label certo, aplicado pelo responsável técnico ou, para
    # risk:low, pela triagem automática do App agent (anti prompt injection)
    if: >-
      github.event.label.name == 'status:ready' &&
      (github.event.sender.login == 'kleidimilson' ||
       (github.event.sender.login == 'kleidimilson-agent[bot]' &&
        contains(github.event.issue.labels.*.name, 'risk:low')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      N: ${{ github.event.issue.number }}
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { token: "${{ steps.app.outputs.token }}", fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Preparar branch e metadados
        id: meta
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          labels=$(gh issue view "$N" --json labels -q '.labels[].name')
          area=$(echo "$labels" | grep '^area:' | head -1 | cut -d: -f2)
          risk=$(echo "$labels" | grep '^risk:' | head -1 | cut -d: -f2)
          type=$(echo "$labels" | grep '^type:' | head -1 | cut -d: -f2)
          [ -n "$area" ] && [ -n "$risk" ] || { echo "Issue sem area:* ou risk:*"; exit 1; }
          type=${type:-feature}
          case "$type" in bug) prefix=fix ;; chore) prefix=chore ;; security) prefix=fix ;; *) prefix=feat ;; esac
          slug=$(gh issue view "$N" --json title -q .title | iconv -f utf-8 -t ascii//TRANSLIT \
            | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | cut -c1-40 | sed 's/-$//')
          {
            echo "area=$area"; echo "risk=$risk"; echo "type=$type"; echo "prefix=$prefix"
            echo "branch=agent/$N-$slug"
          } >> "$GITHUB_OUTPUT"
          git config user.name "agent[bot]"
          git config user.email "agent[bot]@users.noreply.github.com"
          git switch -c "agent/$N-$slug"
          gh issue edit "$N" --remove-label status:ready --add-label status:in-progress
          ./scripts/notify-discord.sh feed "🔨 #$N iniciada ($area, $type)"

      - name: Sessão 1 · testes (aceite, regressão, contrato)
        uses: anthropics/claude-code-action@5a856893345e332afa621934082d8c660c26d689 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Use o subagente test-writer. Issue #${{ env.N }} (type:${{ steps.meta.outputs.type }}).
            Escreva os testes que a issue exige e que FALHAM hoje: aceite para cada
            critério; se type:bug, tests/regression/issue-${{ env.N }}.test.ts; se houver
            integração externa, contrato com fixtures. Não implemente nada.
            Faça um commit "test: testes da issue #${{ env.N }}".
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(pnpm test:*),Bash(pnpm vitest:*),Bash(git add:*),Bash(git commit:*),Bash(gh issue view:*)"

      - name: Congelar testes
        id: frozen
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --name-only HEAD~1 HEAD > /tmp/frozen-tests.txt
          test -s /tmp/frozen-tests.txt || { echo "Nenhum teste escrito"; exit 1; }

      - name: Sessão 2 · implementação
        uses: anthropics/claude-code-action@5a856893345e332afa621934082d8c660c26d689 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Use o subagente ${{ steps.meta.outputs.area }}. Issue #${{ env.N }}.
            Faça os testes do último commit passarem sem alterá-los. Toda função
            exportada nova precisa de teste unit seu. Siga spec, plan, ADRs e o
            design system. Antes de cada commit rode: pnpm lint, pnpm typecheck,
            pnpm test, node scripts/check-test-presence.ts, node scripts/check-design-tokens.ts,
            bash scripts/check-quality.sh origin/main. Siga o "Modelo de domínio" do plan.md.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(pnpm:*),Bash(node scripts/*),Bash(bash scripts/check-quality.sh:*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git status),Bash(gh issue view:*)"

      - name: Verificar que os testes não foram alterados
        run: |
          mapfile -t files < /tmp/frozen-tests.txt
          git diff --quiet ${{ steps.frozen.outputs.sha }} HEAD -- "${files[@]}"

      - name: Abrir PR
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          git push -u origin "${{ steps.meta.outputs.branch }}"
          title=$(gh issue view "$N" --json title -q .title)
          gh pr create --title "${{ steps.meta.outputs.prefix }}: $title" \
            --body "Closes #$N" \
            --label "area:${{ steps.meta.outputs.area }},risk:${{ steps.meta.outputs.risk }},type:${{ steps.meta.outputs.type }}"
          if [ "${{ steps.meta.outputs.risk }}" = "low" ]; then
            gh pr merge --auto --squash
          fi
          gh issue edit "$N" --remove-label status:in-progress --add-label status:in-review
          ./scripts/notify-discord.sh feed "📬 PR aberto para #$N"

      - name: Falhou
        if: failure()
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          gh issue edit "$N" --remove-label status:in-progress --add-label status:needs-human || true
          ./scripts/notify-discord.sh alert "⚠️ #$N travou na implementação: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
