name: Qualidade · auditoria semanal
# Segunda 07:43 em America/Fortaleza. Mede a base inteira (inclusive o legado
# tolerado pela baseline), o agente code-quality prioriza hotspots e abre até 5
# issues pequenas de refatoração como status:draft para triagem.
on:
  schedule:
    - cron: "43 10 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Medir a base inteira
        run: |
          mkdir -p quality-report
          pnpm exec depcruise apps packages -c .dependency-cruiser.cjs --no-ignore-known -T err-long > quality-report/depcruise-all.txt 2>&1 || true
          pnpm exec depcruise apps packages -c .dependency-cruiser.cjs -T metrics > quality-report/depcruise-metrics.txt 2>&1 || true
          pnpm exec eslint -c eslint.quality.config.mjs --no-warn-ignored -f json apps packages > quality-report/eslint.json 2>/dev/null || true
          pnpm exec jscpd . -c .jscpd.json --silent > /dev/null 2>&1 || true
          git log --since="90 days ago" --name-only --pretty=format: -- apps packages \
            | grep -E '\.(ts|tsx)$' | sort | uniq -c | sort -rn | head -100 > quality-report/churn-90d.txt
      - name: Auditoria do agente code-quality
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Use o subagente code-quality no modo "Auditoria".
            Entradas em quality-report/: depcruise-all.txt (camadas, inclusive legado),
            depcruise-metrics.txt (acoplamento/instabilidade), eslint.json (limites de
            Clean Code), jscpd/jscpd-report.json (duplicação), churn-90d.txt (arquivos
            que mais mudam). Hotspot = muito complexo E muda muito.
            Grave quality-report/report.md com: placar (violações de camada, % duplicação,
            funções acima dos limites), top 10 hotspots e tendência em relação à última
            issue "Relatório de qualidade" (gh issue list --label quality-report).
            Abra no máximo 5 issues de refatoração pequenas (até ~400 linhas cada), com
            critério de aceite e labels type:chore,tech-debt,status:draft,area:<área>,risk:low
            ou risk:med. Não repita issue aberta (gh issue list --label tech-debt).
            Publique o relatório como issue com label quality-report e feche a anterior.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 80
            --allowedTools "Read,Grep,Glob,Write(quality-report/**),Bash(git log:*),Bash(gh issue:*)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quality-report-weekly, path: quality-report/, retention-days: 90 }
      - if: always()
        run: |
          ./scripts/notify-discord.sh feed "🧹 Auditoria semanal de qualidade: ${{ job.status }} — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
