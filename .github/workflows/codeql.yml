name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read   # exigido em repositório privado

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          output: sarif-results
          # repositório privado de conta pessoal não tem code scanning: analisa e o gate fica no passo abaixo
          upload: ${{ (github.event.repository.private && github.event.repository.owner.type == 'User') && 'never' || 'always' }}
      - name: Reprovar achados de severidade error
        run: |
          jq -r -s '.[].runs[].results[] | select(.level == "error")
            | "- \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine): \(.message.text)"' \
            sarif-results/*.sarif > findings.txt
          if [ -s findings.txt ]; then echo "CodeQL encontrou problemas:"; cat findings.txt; exit 1; fi
          echo "CodeQL: nenhum achado de severidade error."
