name: Agent · fix
on:
  pull_request:
    types: [labeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}

jobs:
  fix:
    if: >-
      github.event.label.name == 'status:needs-fix' &&
      startsWith(github.event.pull_request.head.ref, 'agent/') &&
      (github.event.sender.type == 'Bot' || github.event.sender.login == 'kleidimilson')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.pull_request.number }}
      DISCORD_WEBHOOK_FEED: ${{ secrets.DISCORD_WEBHOOK_FEED }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Contar tentativas
        id: attempt
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          labels=$(gh pr view "$PR" --json labels -q '.labels[].name')
          n=$(echo "$labels" | grep '^attempt:' | cut -d: -f2 | sort -n | tail -1 || true)
          n=${n:-0}
          area=$(echo "$labels" | grep '^area:' | head -1 | cut -d: -f2)
          echo "area=$area" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 3 ]; then
            gh pr edit "$PR" --remove-label status:needs-fix --add-label status:needs-human
            ./scripts/notify-discord.sh alert "🛑 PR #$PR esgotou 3 tentativas"
            echo "stop=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$n" -gt 0 ]; then gh pr edit "$PR" --remove-label "attempt:$n"; fi
            gh pr edit "$PR" --add-label "attempt:$((n+1))"
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.attempt.outputs.stop != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.attempt.outputs.stop != 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.attempt.outputs.stop != 'true'

      - name: Corrigir
        if: steps.attempt.outputs.stop != 'true'
        uses: anthropics/claude-code-action@5a856893345e332afa621934082d8c660c26d689 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Use o subagente ${{ steps.attempt.outputs.area }}. PR #${{ env.PR }}.
            Leia o último review (gh pr view --comments) e os logs que falharam
            (gh run list + gh run view --log-failed). Corrija só o que foi apontado.
            Não altere nem remova testes de aceite ou de regressão.
            Se faltar teste exigido pela política, escreva. Commit "fix: ajustes do review".
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 50
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(pnpm:*),Bash(node scripts/*),Bash(bash scripts/check-quality.sh:*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(gh run view:*)"

      - name: Proteger testes de regressão
        if: steps.attempt.outputs.stop != 'true'
        run: |
          removed=$(git diff --name-only --diff-filter=DM "origin/${{ github.event.pull_request.base.ref }}" HEAD -- 'tests/regression/**' || true)
          if [ -n "$removed" ]; then echo "Teste de regressão existente alterado/removido:"; echo "$removed"; exit 1; fi

      - name: Enviar
        if: steps.attempt.outputs.stop != 'true'
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          git push
          gh pr edit "$PR" --remove-label status:needs-fix
